name: Controlled feature
description: Propose work inside the approved product scope
title: "[FEATURE] "
labels: ["type:feature"]
body:
  - type: input
    id: phase
    attributes:
      label: Active phase
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the concrete problem, not the proposed technology.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: User value
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Explicit non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Required tests
    validations:
      required: true
  - type: dropdown
    id: change
    attributes:
      label: Decision class
      options:
        - A - Routine implementation
        - B - Product behavior
        - C - Architecture/data/privacy/security
        - D - Scope or mission
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Data, security, privacy, accessibility, and migration impact
